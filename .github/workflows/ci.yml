name: Validate stacks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python scripts/check_no_em_dash.py
      - run: uv run python scripts/check_vocabulary.py
      - run: uv run python scripts/validate_palette.py
      - name: Verify behavior and persistence
        run: uv run pytest --cov=packages --cov-branch --cov-report=term-missing --cov-fail-under=80
      - name: Reject generated evidence drift
        run: uv run python scripts/render_reports.py --check
      - run: uv run python scripts/check_notebooks.py
      - name: Re-execute evidence notebooks
        run: uv run python scripts/build_notebooks.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: node --test packages/edge/test-worker.mjs
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: ''
      - run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /stacks
