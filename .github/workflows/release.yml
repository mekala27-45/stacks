name: Package evidence release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run pytest
      - run: uv run python scripts/render_reports.py --check
      - name: Archive reviewable release evidence
        uses: actions/upload-artifact@v4
        with:
          name: stacks-evidence-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            results/
            report/
            README.md
            RESULTS.md
            docs/
            web/public/data/
            web/public/downloads/

