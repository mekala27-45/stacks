name: Publish bookstore

on:
  workflow_run:
    workflows: [Validate stacks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Validate the exact revision being published
        run: uv run pytest && uv run python scripts/render_reports.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /stacks
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out
      - uses: actions/deploy-pages@v4
        id: deployment
